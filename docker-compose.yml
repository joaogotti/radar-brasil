services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"

  database:
    image: postgres:17
    environment:
      POSTGRES_DB: radar_brasil
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
